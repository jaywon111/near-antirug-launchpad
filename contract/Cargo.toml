[package]
name = "near_antirug_launchpad_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", default-features = false, features = ["legacy"] }
borsh = "1.8.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "legacy"] }
